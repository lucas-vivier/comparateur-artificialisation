# Règles de passage OCS GE (couverture x usage) -> artificialisé / non artificialisé
# Source : fiche « Artificialisation » du portail (MTE, version provisoire du 15/05/2024), p. 3-7
#   https://artificialisation.developpement-durable.gouv.fr/sites/artificialisation/files/inline-files/2024_0122_Fiche_Artificialisation_V5.pdf
# Vérifié empiriquement le 20/10/2026 contre la couche officielle OCSGE-ARTIFICIALISATION
# (Val-de-Marne, millésimes 2018, 2021, 2024, polygones avec crit_seuil = False) : 100 % d'accord.
# Ce fichier est le « scénario de référence ». Les simulations en dérivent des variantes.

reference:
  # 1. Couverture « surfaces anthropisées » (CS1.1.x) -> artificialisé ...
  cs_anthropise: [CS1.1.1.1, CS1.1.1.2, CS1.1.2.1, CS1.1.2.2]
  # ... sauf matériaux minéraux à usage d'extraction (carrières)
  exceptions_anthropise:
    - {cs: CS1.1.2.1, us: US1.3}
  # 2. Végétation non ligneuse (catégorie 5 du décret) -> artificialisée si l'usage est l'un de :
  cs_herbace: [CS2.2.1, CS2.2.2]
  us_herbace_artif: [US2, US235, US3, US4.1.1, US4.1.2, US4.1.3, US4.1.4, US4.1.5,
                     US4.2, US4.3, US5, US6.1, US6.2]
  # 3. Seuillage : groupes contigus de même statut < seuil, entourés de l'autre statut -> basculés
  seuil_m2: 2500
  bati_protege: true        # le bâti (CS1.1.1.1) n'est jamais basculé en non artificialisé
  cs_bati: CS1.1.1.1
  # Exemptions du décret 2023-1096 NON appliquées ici (parcs et jardins publics, PV au sol) :
  # voir la ressource OCSGE-ARTIFICIALISATION-EXEMPTIONS.
